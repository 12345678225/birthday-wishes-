<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthday Login</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #07111f;
            --panel: rgba(255, 255, 255, 0.10);
            --panel-strong: rgba(255, 255, 255, 0.16);
            --text: #f8fbff;
            --muted: #c9d4e4;
            --accent: #6c8cff;
            --accent-2: #5be7c4;
            --pink: #ff5fa3;
            --border: rgba(255, 255, 255, 0.16);
            --error: #ff7b7b;
            --success: #6ef0b1;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #07111f 0%, #14273f 55%, #0d1728 100%);
            color: var(--text);
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .card {
            width: min(100%, 440px);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(16px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .brand-badge {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 20px;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 1.35rem;
        }

        p {
            margin: 0;
            color: var(--muted);
            font-size: 0.95rem;
        }

        form {
            margin-top: 20px;
            display: grid;
            gap: 14px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: var(--muted);
            font-size: 0.95rem;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--panel-strong);
            color: var(--text);
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
        }

        button {
            padding: 13px 16px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--pink), var(--pink-2));
            color: white;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
        }

        .message {
            margin-top: 12px;
            padding: 12px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            border: 1px solid transparent;
            background: rgba(255, 255, 255, 0.06);
            color: var(--muted);
        }

        .message.error {
            color: var(--error);
        }

        .message.success {
            color: var(--success);
        }

        .footer {
            margin-top: 16px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 0.92rem;
        }

        .footer a {
            color: var(--accent-2);
            text-decoration: none;
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="brand">
            <div class="brand-badge">B</div>
            <div>
                <h1>Birthday Login</h1>
                <p>Enter your details to open the birthday card.</p>
            </div>
        </div>

        <form id="loginForm">
            <div>
                <label for="username">Username</label>
                <input id="username" name="username" type="text" placeholder="Enter username" required />
            </div>
            <div>
                <label for="dob">Date of Birth</label>
                <input id="dob" name="dob" type="date" required />
            </div>
            <button type="submit">Submit</button>
        </form>

        <div id="message" class="message">Try any username and date of birth to continue to the birthday card.</div>

        <div class="footer">
            <a href="index.html">Home</a>
            <a href="birthday-surprise.html">Surprise</a>
            <a href="3d-birthday-cake.html">3D Cake</a>
        </div>
    </main>

    <script>
        const form = document.getElementById('loginForm');
        const message = document.getElementById('message');

        form.addEventListener('submit', function (event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const dob = document.getElementById('dob').value;

            if (!username || !dob) {
                message.textContent = 'Please enter both your username and date of birth.';
                message.className = 'message error';
                return;
            }

            if (username.toLowerCase() === 'abinaya' && dob === '2007-07-30') {
                message.textContent = 'Login successful! Opening your birthday card...';
                message.className = 'message success';
                window.location.href = 'birthday-message.html';
            } else {
                message.textContent = 'Username or date of birth is incorrect.';
                message.className = 'message error';
            }
        });
    </script>
</body>

</html>
